schema: '1.0'

matchers:
  git.push.force:
    default:
      regex: '(?i)git(?:\.exe)?\s+push\b.*(--force-with-lease|--force|-f\b)'

  git.tag.delete:
    default:
      regex:
        - '(?i)git(?:\.exe)?\s+tag\s+(-d|--delete)\b'
        - '(?i)git(?:\.exe)?\s+push\b.*(:refs/tags/|--delete\s+[^\s]+\s+v?[0-9])'

  package.publish:
    default:
      regex: '(?i)(npm\s+publish|pnpm\s+publish|cargo\s+publish|twine\s+upload)\b'

operations:
  policy.constant:
    default: 'git rev-parse --is-inside-work-tree'

  repository.branch.current:
    windows: 'powershell -NoProfile -Command "(Get-Content -Raw -LiteralPath ''.sandbox-state/branch.txt'').Trim()"'
    linux: 'sh -c "tr -d ''\r\n'' < .sandbox-state/branch.txt"'
    macos: 'sh -c "tr -d ''\r\n'' < .sandbox-state/branch.txt"'
    default:
      set: windows

  repository.state.current:
    windows: 'powershell -NoProfile -Command "(Get-Content -Raw -LiteralPath ''.sandbox-state/worktree.txt'').Trim()"'
    linux: 'sh -c "tr -d ''\r\n'' < .sandbox-state/worktree.txt"'
    macos: 'sh -c "tr -d ''\r\n'' < .sandbox-state/worktree.txt"'
    default:
      set: windows

  release.evidence.state:
    windows: 'powershell -NoProfile -Command "if (Test-Path -LiteralPath ''.sandbox-state/release-evidence.txt'') { ''present'' } else { ''missing'' }"'
    linux: 'sh -c "if [ -f .sandbox-state/release-evidence.txt ]; then echo present; else echo missing; fi"'
    macos: 'sh -c "if [ -f .sandbox-state/release-evidence.txt ]; then echo present; else echo missing; fi"'
    default:
      set: windows
