[package]
name = "arc"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]
members = ["ui/decision/src-tauri"]
default-members = ["."]
resolver = "3"

[features]
default = []
test-support = []

[dependencies]
# CLI
clap = { version = "4.6.7", features = ["derive"] }

# Parsing / Serialization
serde = { version = "1.0", features = ["derive"] }
yaml_serde = "0.10.7"
serde_json = "1.0"
hex = "0.4.3"
base64 = "0.22.1"

# Error handling
anyhow = "1.0"
thiserror = "2.0.21"

# Filesystem & Paths
pathdiff = "0.2"
regex = "1.10"
sha2 = "0.11.0"
uuid = { version = "1.27", features = ["v4", "serde"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }

# Terminal UX (Opcional)
colored = "3.1.1"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
arc = { path = ".", features = ["test-support"] }
